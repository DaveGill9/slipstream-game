name: Verify game build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-browser-build
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: slipstream-multiplayer-pc
          path: |
            dist/
            server-dist/
            scripts/start-online.mjs
            Start-Multiplayer.cmd
            MULTIPLAYER.md
