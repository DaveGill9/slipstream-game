<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slipstream — Foundry Circuit</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #25372b;
      }
      canvas {
        display: block;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      #game {
        width: 100%;
        height: 100%;
      }
    </style>
    <style>
      .room-overlay {
        position: fixed;
        inset: 0;
        z-index: 10;
        display: grid;
        place-items: center;
        background: #122d2990;
        font: bold 13px monospace;
        color: #edf0da;
      }
      .room-board {
        /* --ui-zoom is set from the window size in src/main.ts. */
        zoom: var(--ui-zoom, 1);
        width: min(430px, calc(94vw / var(--ui-zoom, 1)));
        max-height: calc(94vh / var(--ui-zoom, 1));
        overflow: auto;
        background: #263e35;
        border: 5px solid #c5bea0;
        border-top: 8px solid #e3c66a;
        box-shadow: 6px 6px #172f2b;
        padding: 22px;
      }
      .room-board h1 {
        font-size: 24px;
        color: #f0d278;
        margin: 0 0 16px;
      }
      .room-board h2 {
        letter-spacing: 3px;
      }
      .room-board label {
        display: block;
        margin: 12px 0;
      }
      /* Track, laps and format, side by side in the lobby. */
      .room-options {
        display: grid;
        grid-template-columns: 1.5fr 1fr 1.1fr;
        gap: 10px;
      }
      .room-board .room-options select {
        padding: 10px 6px;
      }
      .room-board input,
      .room-board select {
        display: block;
        width: 100%;
        padding: 10px;
        margin-top: 6px;
        background: #193129;
        color: #edf0da;
        border: 1px solid #8a9c83;
        font: inherit;
      }
      .room-board button {
        display: block;
        width: 100%;
        margin: 10px 0 0;
        padding: 11px;
        border: 0;
        background: #e3c66a;
        color: #233d32;
        font: inherit;
        cursor: pointer;
      }
      .room-board button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .room-board .room-back {
        background: #365346;
        color: #edf0da;
      }
      .room-board ul {
        margin: 0 0 14px;
        padding: 0;
        list-style: none;
      }
      .room-board li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 5px 0;
        border-bottom: 1px solid #50624e;
      }
      /* Lobby (src/network.ts). */
      .room-board li i {
        width: 10px;
        height: 10px;
        flex: none;
      }
      .room-name {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .room-name small {
        margin-left: 8px;
        padding: 1px 5px;
        border: 1px solid #8a9c83;
        font-size: 10px;
        color: #aebb9d;
      }
      .room-chip {
        font-size: 11px;
        letter-spacing: 1px;
        color: #aebb9d;
      }
      .room-chip[data-mood="READY"] {
        color: #9fd67f;
      }
      .room-chip[data-mood="RECONNECTING"] {
        color: #f0d278;
      }
      .room-code {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 12px;
        background: #193129;
        border: 1px solid #8a9c83;
      }
      .room-code .room-hint {
        display: block;
        letter-spacing: 1px;
      }
      .room-code strong {
        font-size: 26px;
        letter-spacing: 5px;
        color: #f0d278;
        user-select: all;
      }
      .room-board .room-code button {
        width: auto;
        margin: 0;
        white-space: nowrap;
      }
      .room-join {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
      }
      .room-board .room-join input {
        margin: 0;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
      .room-board .room-join input::placeholder {
        letter-spacing: 1px;
        color: #7f917c;
      }
      .room-board .room-join button {
        width: auto;
        margin: 0;
        padding: 11px 16px;
      }
      .room-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 14px;
        padding-top: 4px;
        border-top: 1px solid #50624e;
      }
      .room-status:empty {
        display: none;
      }
      .room-board select {
        cursor: pointer;
      }
      .room-track {
        display: block;
        margin-top: 6px;
        color: #f0d278;
      }
      .room-status {
        color: #f0d278;
        line-height: 1.5;
      }
      .room-hint {
        font-size: 11px;
        line-height: 1.6;
        color: #aebb9d;
      }
      /* Garage, settings and pit menus (src/menu.ts). */
      .room-board h1:has(+ .menu-sub) {
        font-size: 30px;
        letter-spacing: 2px;
        margin-bottom: 6px;
      }
      .menu-sub {
        margin: 0 0 18px;
        font-size: 11px;
        letter-spacing: 1px;
        color: #aebb9d;
      }
      .room-board .menu-button {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        text-align: left;
        padding: 12px 14px;
      }
      .room-board button:hover:not(:disabled) {
        filter: brightness(1.12);
      }
      .room-board button:focus-visible,
      .room-board input:focus-visible {
        outline: 2px solid #edf0da;
        outline-offset: 2px;
      }
      .menu-key {
        opacity: 0.65;
      }
      .room-board h3 {
        margin: 20px 0 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid #50624e;
        font-size: 12px;
        letter-spacing: 3px;
        color: #f0d278;
      }
      .room-board .menu-row {
        display: grid;
        grid-template-columns: 76px 1fr 42px;
        align-items: center;
        gap: 12px;
        margin: 10px 0;
      }
      .menu-value {
        text-align: right;
        color: #aebb9d;
      }
      .room-board input[type="range"],
      .room-board input[type="checkbox"] {
        width: auto;
        margin: 0;
        padding: 0;
        border: 0;
        background: none;
        accent-color: #e3c66a;
        cursor: pointer;
      }
      .room-board input[type="range"] {
        width: 100%;
      }
      .room-board .menu-check {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 12px 0 0;
        cursor: pointer;
      }
      .room-board input[type="checkbox"] {
        width: 16px;
        height: 16px;
      }
      .menu-keys {
        display: grid;
        grid-template-columns: 96px 1fr;
        gap: 7px 12px;
        margin: 0 0 8px;
        font-size: 12px;
      }
      .menu-keys dt {
        color: #f0d278;
      }
      .menu-keys dd {
        margin: 0;
      }
      .room-points {
        font-size: 11px;
        color: #f0d278;
      }
      /* Podium (src/podium.ts). */
      .room-board.room-wide {
        width: min(520px, calc(94vw / var(--ui-zoom, 1)));
      }
      .podium-steps {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        align-items: end;
        gap: 10px;
        margin-top: 4px;
        text-align: center;
      }
      .podium-step img {
        display: block;
        width: 56px;
        margin: 6px auto 4px;
        image-rendering: pixelated;
      }
      .podium-name {
        display: block;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .podium-block {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 2px;
        height: 54px;
        background: #a8b4ad;
        color: #233d32;
        font-size: 11px;
      }
      .podium-block b {
        font-size: 24px;
      }
      .podium-step[data-place="1"] .podium-block {
        height: 80px;
        background: #d6b655;
      }
      .podium-step[data-place="3"] .podium-block {
        height: 40px;
        background: #af805a;
      }
      .podium-fastest {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 14px 0 0;
        padding: 8px 10px;
        background: #193129;
        border-left: 4px solid #b38cde;
      }
      .podium-fastest span:first-child {
        font-size: 11px;
        letter-spacing: 1px;
        color: #cdb3ee;
      }
      .podium-fastest strong {
        flex: 1;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .podium-fastest em {
        font-style: normal;
        color: #f0d278;
      }
      .podium-table {
        width: 100%;
        margin: 12px 0 6px;
        border-collapse: collapse;
        font-size: 12px;
      }
      .podium-table th {
        padding: 0 6px 5px;
        font-size: 10px;
        letter-spacing: 1px;
        color: #aebb9d;
        text-align: right;
      }
      .podium-table td {
        padding: 5px 6px;
        border-top: 1px solid #50624e;
        text-align: right;
        white-space: nowrap;
      }
      .podium-table td:first-child {
        width: 22px;
        color: #aebb9d;
      }
      .podium-table th:nth-child(2),
      .podium-table .podium-driver {
        width: 100%;
        text-align: left;
      }
      .podium-driver i {
        display: inline-block;
        width: 9px;
        height: 9px;
        margin-right: 8px;
      }
      .podium-driver small {
        margin-left: 8px;
        padding: 1px 5px;
        border: 1px solid #b38cde;
        font-size: 9px;
        color: #cdb3ee;
      }
      .champion {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        margin: 6px 0 4px;
        padding: 18px 12px 16px;
        background: #193129;
        border: 1px solid #e3c66a;
      }
      .champion img {
        width: 112px;
        image-rendering: pixelated;
      }
      .champion strong {
        font-size: 28px;
        letter-spacing: 2px;
        color: #f0d278;
      }
      .champion span {
        letter-spacing: 2px;
        color: #aebb9d;
      }
      .podium-me td {
        color: #f0d278;
      }
      .podium-gain {
        color: #9fd67f;
      }
      /* In-race HUD (src/hud.ts). --u is one HUD pixel: a whole number of
         screen pixels, so the pixel font stays sharp. */
      .hud {
        position: fixed;
        inset: 0;
        z-index: 5;
        pointer-events: none;
        user-select: none;
        font:
          calc(8 * var(--u)) / 1 "Press Start 2P",
          monospace;
        color: #edf0da;
        -webkit-font-smoothing: none;
      }
      .hud[data-mode="off"],
      .hud[data-mode="status"] > :not(.hud-network) {
        display: none;
      }
      /* Name tags above karts, moved every frame by Hud.tags(). */
      .hud-tags span {
        position: absolute;
        left: 0;
        top: 0;
        white-space: nowrap;
        will-change: transform;
        text-shadow:
          var(--u) 0 #172f2b,
          calc(-1 * var(--u)) 0 #172f2b,
          0 var(--u) #172f2b,
          0 calc(-1 * var(--u)) #172f2b;
      }
      .hud-tags .hud-tag-me {
        color: #f0d278;
      }
      .hud-panel {
        background: #203630f2;
        border: var(--u) solid #83937a;
        box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) #172f2b80;
        padding: calc(7 * var(--u)) calc(8 * var(--u));
      }
      /* Race callouts ("FINAL LAP") and the place gained / lost arrow. */
      .hud-callout {
        position: absolute;
        left: 50%;
        top: calc(10 * var(--u));
        transform: translateX(-50%);
        padding: calc(7 * var(--u)) calc(10 * var(--u));
        white-space: pre;
        background: #203630f2;
        border: var(--u) solid #e3c66a;
        color: #f0d278;
        box-shadow: calc(2 * var(--u)) calc(2 * var(--u)) #172f2b80;
      }
      .hud-callout:empty {
        display: none;
      }
      .hud-callout[data-tone="fastest"] {
        border-color: #b38cde;
        color: #d9c6f2;
      }
      .hud-callout[data-tone="final"] {
        border-color: #edf0da;
        color: #edf0da;
      }
      .hud-arrow {
        display: inline-block;
        margin-left: calc(4 * var(--u));
        border: calc(3 * var(--u)) solid transparent;
        visibility: hidden;
      }
      .hud-arrow[data-way="up"] {
        visibility: visible;
        border-top-width: 0;
        border-bottom: calc(5 * var(--u)) solid #9fd67f;
      }
      .hud-arrow[data-way="down"] {
        visibility: visible;
        border-bottom-width: 0;
        border-top: calc(5 * var(--u)) solid #e97262;
      }
      .hud-dim {
        color: #aebb9d;
      }
      .hud-left {
        position: absolute;
        left: calc(10 * var(--u));
        top: calc(10 * var(--u));
        display: grid;
        gap: calc(5 * var(--u));
      }
      .hud-race,
      .hud-timing {
        display: grid;
        grid-template-columns: auto auto;
        gap: calc(6 * var(--u)) calc(16 * var(--u));
      }
      .hud-race > :nth-child(even),
      .hud-timing > :nth-child(even) {
        text-align: right;
      }
      [data-hud="position"] {
        color: #f0d278;
      }
      .hud-timing {
        justify-self: start;
      }
      .hud-speed {
        position: absolute;
        right: calc(10 * var(--u));
        top: calc(10 * var(--u));
      }
      .hud-banner {
        position: absolute;
        left: 0;
        right: 0;
        top: 40%;
        transform: translateY(-50%);
        text-align: center;
        white-space: pre;
        font-size: calc(40 * var(--u));
        line-height: 1.5;
        text-shadow: calc(4 * var(--u)) calc(4 * var(--u)) #172f2b;
      }
      .hud-banner-small {
        font-size: calc(16 * var(--u));
        text-shadow: calc(2 * var(--u)) calc(2 * var(--u)) #172f2b;
      }
      /* After finishing: whose kart the camera is on, and the keys to
         switch. */
      .hud-watch {
        position: absolute;
        left: 50%;
        bottom: calc(34 * var(--u));
        transform: translateX(-50%);
        white-space: nowrap;
        color: #f0d278;
        text-shadow: var(--u) var(--u) #172f2b;
      }
      .hud-watch[hidden] {
        display: none;
      }
      .hud-watch .hud-keycap {
        margin: 0 calc(8 * var(--u));
        color: #edf0da;
      }
      .podium-next {
        margin: 10px 0 2px;
      }
      .podium-next label {
        display: block;
        margin-bottom: 8px;
      }
      .hud-network {
        position: absolute;
        left: calc(140 * var(--u));
        right: calc(140 * var(--u));
        bottom: calc(12 * var(--u));
        text-align: center;
        line-height: 1.6;
        color: #f0d278;
        text-shadow: var(--u) var(--u) #172f2b;
      }
      .hud-hint {
        position: absolute;
        left: calc(10 * var(--u));
        bottom: calc(10 * var(--u));
        text-shadow: var(--u) var(--u) #172f2b;
      }
      .hud-keycap {
        display: inline-block;
        margin-right: calc(3 * var(--u));
        padding: calc(3 * var(--u));
        background: #203630f2;
        border: var(--u) solid #83937a;
        text-shadow: none;
      }
      .hud-map {
        position: absolute;
        right: calc(10 * var(--u));
        bottom: calc(10 * var(--u));
        box-sizing: content-box;
        width: calc(120 * var(--u));
        height: calc(80 * var(--u));
        padding: 0;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
